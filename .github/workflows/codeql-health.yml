name: CodeQL Health

on:
  workflow_call:
    inputs:
      fail-on:
        description: Audit states that fail the workflow.
        type: string
        default: failing,stalled,stale,degraded,in-progress,not-configured
    secrets:
      GHAS_AUDIT_TOKEN:
        description: Token with GHAS audit read permissions.
        required: true
  workflow_dispatch:

permissions:
  contents: read

env:
  GHAS_AUDIT_VERSION: v2.0.1

jobs:
  audit:
    name: CodeQL setup audit
    runs-on: ubuntu-latest
    steps:
      - name: Install GHAS audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install advanced-security/gh-ghas-audit --pin "$GHAS_AUDIT_VERSION"

      - name: Check for GHAS audit updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if latest=$(gh release view --repo advanced-security/gh-ghas-audit --json tagName --jq .tagName); then
            [[ "$latest" == "$GHAS_AUDIT_VERSION" ]] || echo "::warning title=ghas-audit update available::Pinned $GHAS_AUDIT_VERSION, latest $latest"
          else
            echo "::warning title=ghas-audit update check failed::Unable to determine the latest release"
          fi

      - name: Audit CodeQL setup
        env:
          FAIL_ON: ${{ inputs.fail-on || 'failing,stalled,stale,degraded,in-progress,not-configured' }}
          GH_TOKEN: ${{ secrets.GHAS_AUDIT_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=Missing GHAS audit token::Configure the GHAS_AUDIT_TOKEN Actions secret"
            exit 1
          fi
          set +e
          gh ghas-audit code-scanning --repository "$GITHUB_REPOSITORY" --scan-depth diagnostics --detailed --fail-on "$FAIL_ON" --format json --output audit.json --quiet
          result=$?
          set -e
          if [[ ! -s audit.json ]]; then
            echo "## CodeQL setup audit"$'\n\n'"> [!CAUTION]"$'\n'"> The audit failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
            (( result == 0 )) && result=1
            exit "$result"
          fi
          jq -r '
            def mark:
              if . == "healthy" or . == "configured" or . == "success" or . == "current" or . == "complete" then "✅"
              elif . == "in-progress" then "🟡"
              else "❌"
              end;
            ["## CodeQL setup audit", "",
             "| Repository | Overall | Configuration | Execution | Freshness | Coverage | Languages |",
             "|---|---|---|---|---|---|---|",
             (.repositories[]? |
               "| [\(.full_name)](\(.url)) | \(.status.overall | mark) `\(.status.overall)` | \(.status.configuration | mark) `\(.status.configuration)` | \(.status.execution | mark) `\(.status.execution)` | \(.status.freshness | mark) `\(.status.freshness)` | \(.status.coverage | mark) `\(.status.coverage)` | \(.configured_languages // [] | join(", ")) |"),
             "",
             (if (.stats.incomplete != false) then "> [!CAUTION]\n> The audit report is incomplete." else empty end),
             (.warnings[]? | "> [!WARNING]\n> \(.)"),
             (.organizations[]? | select(.error) | "> [!CAUTION]\n> **\(.login):** \(.error)"),
             "", "**Fail on:** `\(env.FAIL_ON)`"] | .[]
          ' audit.json | tee -a "$GITHUB_STEP_SUMMARY"
          if ! jq -e '.stats.incomplete == false and .summary.total_repositories == 1' audit.json > /dev/null; then
            (( result == 0 )) && result=1
          fi
          exit "$result"
