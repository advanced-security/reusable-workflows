# Exclude generated code, vendored dependencies, build artifacts, and test code from CodeQL analysis where appropriate.
# See: gh.io/codeql-props - Set custom property name:`github-codeql-config-file` to value: `remote=advanced-security/reusable-workflows@main:.github/codeql-config.yml` or simply `remote=reusable-workflows`

paths-ignore:
  # Python: dependencies, examples, and tests
  - "vendor/**"
  - "site-packages/**"
  - "examples/**"
  - "test/**"
  - "tests/**"

  # JavaScript / TypeScript: package dependencies and generated build output
  - "**/node_modules/**"
  - "**/bower_components/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/CoverageResults/**"
  - "**/.next/**"
  - "**/.nuxt/**"

  # JavaScript / TypeScript: test files
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"

  # Common vendored / third-party web dependencies
  - "**/wwwroot/lib/**"
  - "**/deps/**"
  - "**/third_party/**"
  - "**/vendor/**"
  - "**/wp-includes/**"
  - "**/wp-admin/**"

  # Ruby: installed gems and test code
  - "**/gems/**"
  - "**/spec/**/*_spec.rb"
  - "**/test/**/*_test.rb"
